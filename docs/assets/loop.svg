<svg xmlns="http://www.w3.org/2000/svg" width="880" height="300" viewBox="0 0 880 300" role="img" aria-label="ShipPilot loop: Build, Ship, Grow, Measure, Improve, with approval gates">
  <rect width="880" height="300" rx="18" fill="#0b0f19"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#22d3ee"/>
    </marker>
  </defs>
  <g font-family="Menlo, Consolas, monospace" text-anchor="middle">
    <g fill="#141a28" stroke="#22d3ee" stroke-width="2">
      <rect x="30" y="70" width="130" height="64" rx="12"/>
      <rect x="200" y="70" width="130" height="64" rx="12"/>
      <rect x="370" y="70" width="130" height="64" rx="12"/>
      <rect x="540" y="70" width="130" height="64" rx="12"/>
      <rect x="710" y="70" width="140" height="64" rx="12"/>
    </g>
    <g fill="#e2e8f0" font-size="18" font-weight="bold">
      <text x="95" y="108">Build</text>
      <text x="265" y="108">Ship</text>
      <text x="435" y="108">Grow</text>
      <text x="605" y="108">Measure</text>
      <text x="780" y="108">Improve</text>
    </g>
    <g fill="#7886a0" font-size="12">
      <text x="95" y="160">code, review</text>
      <text x="265" y="160">Fastlane, listing</text>
      <text x="435" y="160">ads (read-first)</text>
      <text x="605" y="160">analytics, cohorts</text>
      <text x="780" y="160">one change at a time</text>
    </g>
    <g stroke="#22d3ee" stroke-width="2" marker-end="url(#arrow)">
      <line x1="160" y1="102" x2="196" y2="102"/>
      <line x1="330" y1="102" x2="366" y2="102"/>
      <line x1="500" y1="102" x2="536" y2="102"/>
      <line x1="670" y1="102" x2="706" y2="102"/>
    </g>
    <path d="M780,134 C780,250 95,250 95,138" fill="none" stroke="#4ade80" stroke-width="2" stroke-dasharray="6 6" marker-end="url(#arrow)"/>
    <text x="440" y="236" fill="#4ade80" font-size="14">re-measure → next loop</text>
    <text x="440" y="40" fill="#7886a0" font-size="13">every upload, store-text publish and ad spend waits for your explicit approval</text>
  </g>
</svg>
