name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Example metadata passes the checker
        run: |
          python scripts/check_metadata.py --platform ios --metadata examples/fastlane/metadata
          python scripts/check_metadata.py --platform android --metadata examples/fastlane/metadata/android
      - name: Manifests are valid JSON with required fields
        run: |
          python - <<'PY'
          import json, pathlib
          plugin = json.loads(pathlib.Path(".claude-plugin/plugin.json").read_text())
          market = json.loads(pathlib.Path(".claude-plugin/marketplace.json").read_text())
          assert plugin["name"] == "shippilot" and plugin["version"]
          assert any(p["name"] == plugin["name"] for p in market["plugins"])
          for skill in pathlib.Path("skills").iterdir():
              text = (skill / "SKILL.md").read_text()
              assert text.startswith("---\nname: " + skill.name + "\n"), skill
          for cmd in pathlib.Path("commands").glob("*.md"):
              assert cmd.read_text().startswith("---\ndescription: "), cmd
          print("manifests ok")
          PY
